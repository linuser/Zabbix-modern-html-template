# Builds all media types on every push (any branch) and pull request and uploads them as a workflow artifact.
# Pushing a tag v<version>... (e.g. v1.2.0) additionally publishes a GitHub release
# with one zip per variant, per language, everything, and the HTML previews.
name: Build

on:
  push:
    branches: ["**"]      # every branch, so forks and feature branches get the zips too
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build
        env:
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python build.py --preview ${RELEASE:+--release "$RELEASE"}

      - uses: actions/upload-artifact@v4
        with:
          name: zabbix-html-mail
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zabbix-html-mail
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
